<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini RPG</title>

<style>
body {
    background: #160b25;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.game {
    background: #302050;
    width: 320px;
    padding: 20px;
    border-radius: 20px;
    border: 3px solid pink;
    text-align: center;
}

.hero {
    font-size: 70px;
}

.box {
    background: #10081a;
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 20px;
    background: #ff4f9a;
    color: white;
    font-size: 16px;
}
</style>

</head>

<body>

<div class="game">

<div class="hero">🧙‍♀️</div>

<h2>Mini RPG</h2>

<div class="box" id="texte">
Bienvenue aventurier !<br>
Une quête t'attend...
</div>

<button id="bouton">Commencer</button>

</div>


<script>

let etape = 0;

const texte = document.getElementById("texte");
const bouton = document.getElementById("bouton");

bouton.onclick = function(){

    etape++;

    if(etape === 1){
        texte.innerHTML = "📜 Mission : trouver le trésor magique !";
        bouton.innerHTML = "Continuer";
    }

    else if(etape === 2){
        texte.innerHTML = "⚔️ Un monstre apparaît !<br>Tu attaques avec ton épée.";
        bouton.innerHTML = "Attaquer";
    }

    else if(etape === 3){
        texte.innerHTML = "💥 Victoire ! Tu gagnes 100 pièces d'or.";
        bouton.innerHTML = "Fin";
    }

    else{
        texte.innerHTML = "🏆 Quête terminée !";
        bouton.style.display = "none";
    }

};

</script>

</body>
</html>
