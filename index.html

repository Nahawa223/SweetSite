<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Légende du Sahel - RPG Textuel</title>
    <style>
        /* --- STYLES RETRO JRPG --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            background-color: #05050a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Effet d'étoiles en fond */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: 1;
        }

        /* Conteneur principal */
        #game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background: rgba(15, 15, 25, 0.95);
            border: 4px solid #ff79b0;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 121, 176, 0.3);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* En-tête / Statistiques du Joueur */
        .stats-bar {
            background: #111122;
            border: 2px solid #444466;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 5px;
        }

        .bar-container {
            width: 100%;
            background: #333;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 3px;
        }

        .hp-fill {
            height: 100%;
            background: #ff4757;
            width: 100%;
            transition: width 0.3s ease;
        }

        /* Scène / Rendu Visuel (SVG + Emojis) */
        .scene-window {
            height: 160px;
            background: #000;
            border: 2px solid #444466;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .monster-avatar {
            font-size: 5rem;
            animation: idle 2s infinite ease-in-out;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        @keyframes idle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .shake {
            animation: shakeAnim 0.3s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Boîte de Dialogue avec effet Machine à Écrire */
        .dialogue-box {
            background: #0d0d1a;
            border: 2px solid #ff79b0;
            border-radius: 8px;
            padding: 12px;
            min-height: 90px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ffe6f0;
        }

        /* Options & Boutons */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: linear-gradient(180deg, #2c2c54 0%, #171738 100%);
            color: #fff;
            border: 2px solid #6c5ce7;
            padding: 10px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            background: #6c5ce7;
            border-color: #a29bfe;
            transform: scale(1.02);
        }

        .btn-action {
            grid-column: span 2;
            background: linear-gradient(180deg, #ff4081 0%, #b83280 100%);
            border-color: #ff79b0;
        }

        /* Cache les menus inactifs */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="game-container">
        
        <!-- BARRE DE STATS -->
        <div class="stats-bar" id="stats-bar">
            <div>🎮 <span id="p-name">Héros</span> (Niv. <span id="p-lvl">1</span>)</div>
            <div>💰 <span id="p-gold">20</span> Or</div>
            <div>🧪 Potions: <span id="p-potions">2</span></div>
            <div style="width: 100%;">
                PV: <span id="p-hp">30</span>/<span id="p-max-hp">30</span>
                <div class="bar-container"><div class="hp-fill" id="hp-bar"></div></div>
            </div>
        </div>

        <!-- ZONE VISUELLE -->
        <div class="scene-window" id="scene-window">
            <div class="monster-avatar" id="avatar">👸✨</div>
        </div>

        <!-- BOÎTE DE DIALOGUE -->
        <div class="dialogue-box" id="dialogue-text">
            Bienvenue dans La Légende du Sahel ! Choisissez une option pour commencer...
        </div>

        <!-- GRILLE DE COMMANDES -->
        <div class="controls-grid" id="controls">
            <!-- Boutons injectés dynamiquement via JS -->
        </div>

    </div>

    <script>
        /* --- AUDIO SYNTHETIQUE (Web Audio API) --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        /* --- ÉTAT DU JEU (STATE) --- */
        let player = {
            name: "Voyageur",
            hp: 30,
            maxHp: 30,
            gold: 20,
            lvl: 1,
            xp: 0,
            potions: 2
        };

        let currentEnemy = null;

        const enemies = [
            { name: "Scorpion du Désert", hp: 15, maxHp: 15, atk: 4, avatar: "🦂", xp: 10, gold: 15 },
            { name: "Esprit de la Forêt", hp: 25, maxHp: 25, atk: 7, avatar: "     🌿👻", xp: 20, gold: 25 },
            { name: "Gardien du Donjon", hp: 45, maxHp: 45, atk: 12, avatar: "👹", xp: 50, gold: 100 }
        ];

        /* --- EFFET MACHINE À ÉCRIRE --- */
        function typeWriter(text, elementId, speed = 25) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        /* --- MISE À JOUR DE L'INTERFACE --- */
        function updateUI() {
            document.getElementById('p-name').textContent = player.name;
            document.getElementById('p-lvl').textContent = player.lvl;
            document.getElementById('p-gold').textContent = player.gold;
            document.getElementById('p-hp').textContent = player.hp;
            document.getElementById('p-max-hp').textContent = player.maxHp;
            document.getElementById('p-potions').textContent = player.potions;

            const hpPercent = (player.hp / player.maxHp) * 100;
            document.getElementById('hp-bar').style.width = Math.max(0, hpPercent) + "%";

            // Sauvegarde automatique dans le navigateur
            localStorage.setItem('rpg_save', JSON.stringify(player));
        }

        /* --- ARBRE DE NAVIGATION / CHOIX --- */
        function showMenu() {
            updateUI();
            document.getElementById('avatar').textContent = "🏰";
            typeWriter("Tu es au centre du Village. Où souhaites-tu te rendre ?", "dialogue-text");

            setButtons([
                { text: "🌲 Explorer la Forêt", action: () => startBattle(0) },
                { text: "🏰 Donjon Sombre", action: () => startBattle(2) },
                { text: "🛒 Visiter la Boutique", action: openShop },
                { text: "💾 Recommencer", action: resetGame }
            ]);
        }

        /* --- SYSTEME DE COMBAT --- */
        function startBattle(enemyIndex) {
            currentEnemy = { ...enemies[enemyIndex] };
            document.getElementById('avatar').textContent = currentEnemy.avatar;
            typeWriter(`Un ${currentEnemy.name} sauvage apparaît !`, "dialogue-text");

            setCombatButtons();
        }

        function setCombatButtons() {
            setButtons([
                { text: "⚔️ Attaquer", action: playerAttack },
                { text: "🧪 Potion (+15 PV)", action: usePotion },
                { text: "🏃 Fuir", action: showMenu }
            ]);
        }

        function playerAttack() {
            playSound('hit');
            const dmg = Math.floor(Math.random() * 5) + 5 + (player.lvl * 2);
            currentEnemy.hp -= dmg;

            document.getElementById('scene-window').classList.add('shake');
            setTimeout(() => document.getElementById('scene-window').classList.remove('shake'), 300);

            if (currentEnemy.hp <= 0) {
                playSound('win');
                player.gold += currentEnemy.gold;
                player.xp += currentEnemy.xp;
                
                // Montée de niveau
                if (player.xp >= player.lvl * 20) {
                    player.lvl++;
                    player.maxHp += 10;
                    player.hp = player.maxHp;
                    typeWriter(`Victoire ! Tu gagnais ${currentEnemy.gold} Or et montes au Niveau ${player.lvl} ! 🎉`, "dialogue-text");
                } else {
                    typeWriter(`Victoire ! Tu as vaincu le ${currentEnemy.name} et gagné ${currentEnemy.gold} Or !`, "dialogue-text");
                }

                updateUI();
                setButtons([{ text: "Continuer", action: showMenu }]);
            } else {
                typeWriter(`Tu infliges ${dmg} dégâts ! Le ${currentEnemy.name} réplique !`, "dialogue-text");
                setTimeout(enemyAttack, 1200);
            }
        }

        function enemyAttack() {
            playSound('hit');
            const dmg = Math.max(1, currentEnemy.atk - Math.floor(player.lvl / 2));
            player.hp -= dmg;
            updateUI();

            if (player.hp <= 0) {
                player.hp = 0;
                updateUI();
                document.getElementById('avatar').textContent = "💀";
                typeWriter("Tu as été vaincu... Le jeu va réinitialiser tes PV au village.", "dialogue-text");
                player.hp = player.maxHp;
                setButtons([{ text: "Se réveiller au village", action: showMenu }]);
            } else {
                setCombatButtons();
            }
        }

        function usePotion() {
            if (player.potions > 0 && player.hp < player.maxHp) {
                playSound('win');
                player.potions--;
                player.hp = Math.min(player.maxHp, player.hp + 15);
                updateUI();
                typeWriter("Tu bois une potion et récupères 15 PV !", "dialogue-text");
                setTimeout(enemyAttack, 1200);
            } else {
                typeWriter("Pas de potion disponible ou santé déjà au maximum !", "dialogue-text");
            }
        }

        /* --- BOUTIQUE --- */
        function openShop() {
            document.getElementById('avatar').textContent = "🧙‍♂️";
            typeWriter("Marchand: 'Bienvenue ! Que veux-tu acheter ?'", "dialogue-text");

            setButtons([
                { text: "Acheter Potion (10 Or)", action: () => buyItem('potion', 10) },
                { text: "Retourner au Village", action: showMenu }
            ]);
        }

        function buyItem(item, price) {
            if (player.gold >= price) {
                playSound('win');
                player.gold -= price;
                if (item === 'potion') player.potions++;
                updateUI();
                typeWriter("Achat réussi !", "dialogue-text");
            } else {
                typeWriter("Tu n'as pas assez d'or !", "dialogue-text");
            }
        }

        /* --- UTILITAIRE DE BOUTONS --- */
        function setButtons(buttons) {
            const controls = document.getElementById('controls');
            controls.innerHTML = "";
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = "btn";
                btn.textContent = b.text;
                btn.onclick = () => {
                    playSound('click');
                    b.action();
                };
                controls.appendChild(btn);
            });
        }

        function resetGame() {
            localStorage.removeItem('rpg_save');
            player = { name: "Voyageur", hp: 30, maxHp: 30, gold: 20, lvl: 1, xp: 0, potions: 2 };
            showMenu();
        }

        /* --- INITIALISATION --- */
        const savedData = localStorage.getItem('rpg_save');
        if (savedData) {
            player = JSON.parse(savedData);
        }
        showMenu();
    </script>
</body>
</html>
