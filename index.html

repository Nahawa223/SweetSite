<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma page</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff79b0, #6c5ce7);
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 300px;
}

h1 {
    color: #333;
}

p {
    color: #666;
}

button {
    background: #ff4081;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    transform: scale(1.05);
}
</style>

</head>

<body>

<div class="card">
    <h1>✨ Bienvenue</h1>
    <p>Découvre mon univers et mes services.</p>

    <button onclick="message()">
        Me contacter
    </button>
</div>


<script>
function message(){
    alert("Merci de ton intérêt 💖");
}
</script>

</body>
</html>
