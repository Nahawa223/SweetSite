<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Princesse du Sahel - Quête Web RPG</title>
    
    <!-- Confettis pour la victoire -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* --- STYLES RETRO JRPG & DESIGN --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Courier New', monospace;
            user-select: none;
        }

        body {
            background: #0d0614;
            background: radial-gradient(circle, #250b3a 0%, #08020f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Arrière-plan d'étoiles animées */
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Conteneur principal RPG */
        #rpg-container {
            width: 100%;
            max-width: 440px;
            background: rgba(25, 10, 40, 0.95);
            border: 3px solid #ff79b0;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 121, 176, 0.35);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            z-index: 10;
        }

        /* Barre de statut du joueur */
        .stats-bar {
            background: rgba(10, 5, 20, 0.8);
            border: 1px solid rgba(255, 121, 176, 0.4);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .bar-container {
            width: 100px;
            background: #331530;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ff79b0;
        }

        .hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4081, #ff79b0);
            width: 100%;
            transition: width 0.4s ease;
        }

        /* Fenêtre de scène avec la Princesse en SVG */
        .scene-window {
            height: 180px;
            background: rgba(15, 5, 25, 0.9);
            border: 2px solid #ff79b0;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .avatar-box {
            width: 150px;
            height: 150px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .shake {
            animation: shakeAnim 0.3s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Boîte de Dialogue avec nom de personnage */
        .dialogue-box {
            background: rgba(10, 3, 18, 0.9);
            border: 2px solid #ff79b0;
            border-radius: 12px;
            padding: 15px;
            min-height: 110px;
            position: relative;
        }

        .speaker-tag {
            position: absolute;
            top: -12px;
            left: 15px;
            background: #ff4081;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dialogue-text {
            color: #ffe6f0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-top: 5px;
        }

        /* Grille des Boutons */
        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            min-height: 50px;
        }

        .btn {
            background: linear-gradient(90deg, #ff4081, #b83280);
            color: #fff;
            border: 2px solid #ff9ebb;
            padding: 12px 15px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3);
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(90deg, #4a5568, #2d3748);
            border-color: #a0aec0;
            box-shadow: none;
        }

        .btn-insta {
            background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
        }

        .btn-tiktok {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
        }

        .price-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed #ff79b0;
            border-radius: 10px;
            padding: 10px;
            margin-top: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- RPG Container -->
    <div id="rpg-container">
        
        <!-- BARRE DE STATISTIQUES DU JOUEUR -->
        <div class="stats-bar">
            <div>🎮 <span id="p-name">Héros</span></div>
            <div>💰 Or: <span id="p-gold">500</span></div>
            <div>
                PV: <span id="p-hp">30</span>/30
                <div class="bar-container"><div class="hp-fill" id="hp-bar"></div></div>
            </div>
        </div>

        <!-- AFFICHAGE DU PERSONNAGE (FILLE / PRINCESSE EN SVG) -->
        <div class="scene-window" id="scene-window">
            <svg class="avatar-box" id="avatar-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="90" fill="#3a1c54"/>
                <!-- Cheveux longs -->
                <path d="M 45 110 Q 20 170 55 190 Q 100 200 145 190 Q 180 170 155 110 Z" fill="#1f132b"/>
                <!-- Visage -->
                <circle cx="100" cy="105" r="50" fill="#8d5524"/>
                <!-- Yeux RPG Manga -->
                <ellipse cx="80" cy="100" rx="8" ry="11" fill="#fff"/>
                <ellipse cx="120" cy="100" rx="8" ry="11" fill="#fff"/>
                <ellipse cx="80" cy="101" rx="5" ry="8" fill="#ff4081"/>
                <ellipse cx="120" cy="101" rx="5" ry="8" fill="#ff4081"/>
                <circle cx="78" cy="98" r="2.5" fill="#ffffff"/>
                <circle cx="118" cy="98" r="2.5" fill="#ffffff"/>
                <!-- Tiara / Couronne -->
                <path d="M 75 62 L 85 45 L 100 58 L 115 45 L 125 62 Z" fill="#ffd700" stroke="#ffb700" stroke-width="2"/>
                <circle cx="100" cy="52" r="3" fill="#ff4081"/>
                <!-- Joues -->
                <ellipse cx="72" cy="112" rx="6" ry="3" fill="#ff6b81" opacity="0.6"/>
                <ellipse cx="128" cy="112" rx="6" ry="3" fill="#ff6b81" opacity="0.6"/>
                <!-- Sourire -->
                <path d="M 92 118 Q 100 126 108 118" stroke="#1a0d00" stroke-width="3" stroke-linecap="round" fill="none"/>
                <!-- Cheveux devant -->
                <path d="M 48 95 Q 75 65 100 82 Q 125 65 152 95 Q 100 70 48 95 Z" fill="#1f132b"/>
            </svg>
        </div>

        <!-- BOÎTE DE DIALOGUE -->
        <div class="dialogue-box">
            <span class="speaker-tag" id="speaker">Princesse du Sahel</span>
            <div class="dialogue-text" id="dialogue-text">
                Chargement de l'aventure...
            </div>
        </div>

        <!-- BOTE DE COMMANDES -->
        <div class="controls-grid" id="controls">
            <!-- Injecté en JS -->
        </div>

    </div>

    <script>
        /* --- EFFET ÉTOILES DU FOND --- */
        for (let i = 0; i < 35; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.setProperty('--duration', (Math.random() * 2 + 1) + 's');
            document.body.appendChild(star);
        }

        /* --- SOUND GENERATOR (Web Audio API - Zéro fichier externe) --- */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(523, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        /* --- ÉTAT DU JOUEUR --- */
        let player = {
            hp: 30,
            gold: 2500
        };

        let dodgeCount = 0;

        /* --- MACHINE À ÉCRIRE --- */
        function typeWriter(text, elementId, speed = 20) {
            const el = document.getElementById(elementId);
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function updateUI() {
            document.getElementById('p-hp').textContent = player.hp;
            document.getElementById('p-gold').textContent = player.gold;
            const percent = (player.hp / 30) * 100;
            document.getElementById('hp-bar').style.width = percent + "%";
        }

        /* --- ÉTAPES DU JEU / RPG NOVEL --- */

        // ÉTAPE 1 : Accueil
        function step1() {
            updateUI();
            typeWriter("« Bienvenue, noble voyageur ! ✨ Je suis la Princesse du Sahel. J'ai préparé une quête magique pour toi... »", "dialogue-text");
            
            setButtons([
                { text: "Écouter la proposition 📜", action: step2 }
            ]);
        }

        // ÉTAPE 2 : Présentation des Tarifs
        function step2() {
            const htmlText = "« Choisis ton grimoire pour obtenir ton propre site personnalisé web : »<div class='price-card'>🌸 <b>Pack Standard :</b> 2 500 FCFA (~4€)<br>✨ <b>Pack VIP :</b> 4 500 FCFA (~7€)</div>";
            document.getElementById('dialogue-text').innerHTML = htmlText;

            setButtons([
                { text: "Continuer l'aventure ⚔️", action: step3 }
            ]);
        }

        // ÉTAPE 3 : La Question & Esquive
        function step3() {
            typeWriter("« Es-tu prêt à obtenir ton site personnalisé dès aujourd'hui ? »", "dialogue-text");

            setButtons([
                { text: "Oui, absolument ! 🥰", action: step4 },
                { text: "Non", action: dodgeNo, id: "noBtn", class: "btn-secondary" }
            ]);
        }

        // Esquive du bouton "Non"
        function dodgeNo() {
            const noBtn = document.getElementById('noBtn');
            const container = document.getElementById('controls');
            dodgeCount++;

            if (dodgeCount < 3) {
                const maxX = container.offsetWidth - noBtn.offsetWidth;
                const x = Math.max(0, Math.random() * maxX);
                const y = (Math.random() - 0.5) * 50;

                noBtn.style.position = "absolute";
                noBtn.style.left = x + "px";
                noBtn.style.top = y + "px";
            } else {
                noBtn.style.position = "static";
                noBtn.textContent = "💖 D'accord, je veux !";
                noBtn.className = "btn";
                noBtn.onclick = step4;
            }
        }

        // ÉTAPE 4 : Victoire et Réseaux Sociaux
        function step4() {
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });
            playSound('win');

            typeWriter("« Victoire ! 🎉 Rejoins-moi directement sur mes réseaux sociaux pour réserver ton pack : »", "dialogue-text");

            const controls = document.getElementById('controls');
            controls.innerHTML = `
                <a href="https://www.instagram.com/la_princesse_du_sahel" target="_blank" class="btn btn-insta">📸 Instagram (@la_princesse_du_sahel)</a>
                <a href="https://www.tiktok.com/@la_princesse_du_sahel" target="_blank" class="btn btn-tiktok">🎵 TikTok (@la_princesse_du_sahel)</a>
                <button class="btn btn-secondary" style="margin-top:5px;" onclick="location.reload()">Recommencer 🔄</button>
            `;
        }

        /* --- ASSISTANT DE BOUTONS --- */
        function setButtons(buttons) {
            const controls = document.getElementById('controls');
            controls.innerHTML = "";
            buttons.forEach(b => {
                const btn = document.createElement('button');
                btn.className = "btn " + (b.class || "");
                if (b.id) btn.id = b.id;
                btn.textContent = b.text;
                btn.onclick = () => {
                    playSound('click');
                    b.action();
                };
                controls.appendChild(btn);
            });
        }

        // Lancement du jeu
        step1();
    </script>
</body>
</html>
